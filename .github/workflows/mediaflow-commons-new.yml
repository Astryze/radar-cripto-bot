name: MediaFlow — 10 fotos novas de unhas
on:
  push:
    branches: [feature/mediaflow-unhas-v04]
    paths:
      - '.github/workflows/mediaflow-commons-new.yml'
      - 'mediaflow_unhas/photo_finish.py'
      - 'mediaflow_unhas/photo_video.py'
      - 'mediaflow_unhas/commons_category_source.py'
  workflow_dispatch:
    inputs:
      enviar_telegram:
        description: Enviar vídeo ao Telegram após 10 fotos distintas
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  gerar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg e PIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow requests pytest
      - name: Testar acabamento, formato e validação
        run: python -m pytest -q mediaflow_unhas/test_photo_finish.py
      - name: Baixar fotografias novas e montar MP4 sem IA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIAR: ${{ github.event_name == 'workflow_dispatch' && inputs.enviar_telegram }}
        run: |
          args=(--commons-curated --saida output/commons-novos)
          if [[ "$ENVIAR" == "true" ]]; then args+=(--enviar-telegram); fi
          python mediaflow_unhas/photo_video.py "${args[@]}"
      - name: Registrar fotos usadas para evitar repetição em próximos vídeos
        if: success()
        run: |
          python mediaflow_unhas/update_photo_history.py \
            --credits output/commons-novos/sources/source_credits.json \
            --source-dir output/commons-novos/sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mediaflow_unhas/used_photo_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data(mediaflow): record source photos used in approved nail video [skip ci]"
            if ! git push origin HEAD:feature/mediaflow-unhas-v04; then
              echo "::warning::Não foi possível persistir histórico. Antes da próxima produção, registre as imagens usadas."
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unhas-imagens-novas-${{ github.run_id }}
          path: output/commons-novos/
          if-no-files-found: warn
          retention-days: 7

