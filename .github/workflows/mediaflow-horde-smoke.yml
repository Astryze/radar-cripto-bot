name: MediaFlow — Teste real AI Horde
on:
  push:
    branches: [feature/mediaflow-unhas-v04]
    paths: ['mediaflow_unhas/horde_probe.py', '.github/workflows/mediaflow-horde-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests Pillow
      - name: Gerar uma imagem real na API AI Horde (não envia Telegram)
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY || '0000000000' }}
        run: python mediaflow_unhas/horde_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horde-probe-${{ github.run_id }}
          path: output/horde-probe/
          if-no-files-found: warn
          retention-days: 3
